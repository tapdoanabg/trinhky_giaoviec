<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16365c">
<title>ABG – Giao việc &amp; Trình ký</title>
<style>
:root{--brand:#16365c;--accent:#e07a2e;--bg:#f5f3ee;--line:#e2ded5;--text:#1d2a2b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
.frames{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
iframe[hidden]{display:none}
nav{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1.5px solid var(--line);box-shadow:0 -4px 16px rgba(22,54,92,.08)}
nav button{min-height:58px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--text);font-family:inherit;font-size:18px;font-weight:700;line-height:1.2;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
nav button.on{background:var(--brand);border-color:var(--brand);color:#fff}
nav button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ic{font-size:22px}
.badge{min-width:24px;padding:1px 7px;border-radius:999px;background:var(--accent);color:#fff;font-size:13px;font-weight:800}
.badge:empty{display:none}
</style>
<script>window.KV_SHELL = true;</script>
</head>
<body>
<div class="frames">
  <iframe id="f-giaoviec" title="Giao việc"></iframe>
  <iframe id="f-trinhky" title="Trình ký" hidden></iframe>
</div>
<nav aria-label="Chọn ứng dụng">
  <button id="b-giaoviec" onclick="show('giaoviec')"><span class="ic" aria-hidden="true">📋</span>Giao việc</button>
  <button id="b-trinhky" onclick="show('trinhky')"><span class="ic" aria-hidden="true">✍</span>Trình ký <span class="badge" id="tk-count" aria-label="tờ chờ bạn ký"></span></button>
</nav>
<script>
// Trang gộp: mỗi ứng dụng chạy trong 1 khung riêng, dùng chung đăng nhập (cùng trang web nên cùng bộ nhớ trình duyệt)
const V = '202610151711';
const APPS = { giaoviec: 'giaoviec.html', trinhky: 'trinhky.html' };
function show(app){
  if(!APPS[app]) app = 'giaoviec';
  Object.keys(APPS).forEach(k=>{
    const f=document.getElementById('f-'+k), on=k===app;
    if(on && !f.src) f.src = APPS[k] + '?v=' + V + location.search.replace(/^\?/, '&');
    else if(on){ try{ f.contentWindow.kvOnShow && f.contentWindow.kvOnShow(); }catch(e){} }
    f.hidden = !on;
    document.getElementById('b-'+k).classList.toggle('on', on);
    document.getElementById('b-'+k).setAttribute('aria-current', on ? 'page' : 'false');
  });
  if(location.hash !== '#'+app) history.replaceState(null, '', '#'+app);
  document.title = (app==='trinhky' ? 'Trình ký' : 'Giao việc') + ' – ABG';
}
window.addEventListener('message', e=>{
  if(e.origin !== location.origin || !e.data || !e.data.kv) return;
  if(e.data.tk !== undefined) document.getElementById('tk-count').textContent = e.data.tk || '';
});
window.addEventListener('hashchange', ()=>show(location.hash.slice(1)));
show(location.hash.slice(1) || 'giaoviec');
</script>
</body>
</html>
